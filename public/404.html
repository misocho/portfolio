      :root { color-scheme: light; --orange: #fe7141; --ink: #111111; --muted: #4a2418; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { background: var(--orange); color: var(--ink); font-family: "Public Sans", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      .poster { min-height: 100svh; display: flex; flex-direction: column; padding: clamp(1.25rem, 4vw, 2.5rem); }
      .top, .foot { display: flex; justify-content: space-between; align-items: baseline; gap: 1.5rem; font-size: 0.8125rem; font-weight: 700; line-height: 1.2; letter-spacing: 0.06em; text-transform: uppercase; }
      .mark { font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-size: 1.75rem; letter-spacing: -0.01em; }
      .main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: clamp(2rem, 5vw, 4rem); max-width: 62rem; }
      .kicker { margin: 0 0 0.5rem; font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      h1 { margin: 0; font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-size: clamp(4rem, 12vw, 9.8rem); font-weight: 700; line-height: 0.84; letter-spacing: -0.012em; text-transform: uppercase; }
      .note { max-width: 38ch; margin: clamp(1.5rem, 3vw, 2.5rem) 0 0; font-size: clamp(1rem, 1.8vw, 1.25rem); line-height: 1.45; }
      .return { display: inline-flex; align-items: center; gap: 0.7em; align-self: flex-start; margin-top: clamp(1.5rem, 3vw, 2.25rem); padding: 0.85rem 1.1rem; background: var(--ink); color: #fff; font-size: 0.9375rem; font-weight: 600; text-decoration: none; }
      .return:hover { background: #2a2a2a; }
      .return:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
      .foot { border-top: 2px solid var(--ink); padding-top: 0.8rem; }
      @media (max-width: 520px) { .foot { display: grid; gap: 0.35rem; } }
