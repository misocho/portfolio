<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Field Notes — page not found</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3efe6;
        color: #292d28;
        font-family: Georgia, 'Times New Roman', serif;
        padding: 2rem;
      }
      .wrap { max-width: 34rem; }
      .label {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #a6533a;
      }
      h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.1; margin: 0.6rem 0 1rem; font-weight: 500; }
      p { color: #686a60; line-height: 1.6; }
      a { color: #a6533a; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="label">Page 404 · Edition 2026</p>
      <h1>This page slipped out of the issue.</h1>
      <p>The note you were looking for isn't bound into this edition. Head back to the front matter.</p>
      <p><a id="home" href="/">Return to Field Notes →</a></p>
    </div>
    <script>
      // GitHub Pages serves this file for unknown paths. This is a single-page
      // site, so send the reader back to the base of the site. If your repo is
      // NOT named "portfolio", update BASE below to match vite.config.ts.
      (function () {
        var BASE = '/portfolio/';
        var link = document.getElementById('home');
        link.setAttribute('href', BASE);
        if (location.pathname.indexOf(BASE) !== 0) {
          // User/org site served from root.
          link.setAttribute('href', '/');
        }
      })();
    </script>
  </body>
</html>
