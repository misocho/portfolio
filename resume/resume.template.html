<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brian Misocho Morang’a — CV</title>
    <style>
      /* ------------------------------------------------------------------
         GENERATED FILE — do not edit by hand.
         Source: src/data/cv.json + resume/resume.template.html
         Regenerate: npm run resume:build
         Self-contained, on-brand A4 CV. Fonts are inlined as data URIs so the
         file prints identically from disk, from the site, or over HTTP.
         ------------------------------------------------------------------ */

      /*__FONT_FACES__*/

      :root {
        --paper: #ffffff;
        --ink: #111111;
        --muted: #5f5f5f;
        --orange: #fe7141;
        --line: #d8d8d8;
      }

      @page {
        size: A4;
        margin: 12mm 14mm 10mm;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      body {
        margin: 0;
        font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 9.6pt;
        line-height: 1.36;
        color: var(--ink);
        background: #fff;
        font-variant-numeric: tabular-nums;
      }

      a {
        color: var(--ink);
        text-decoration: underline;
        text-decoration-thickness: 0.5pt;
        text-underline-offset: 1pt;
      }

      p {
        margin: 0 0 0.5em;
      }

      @media screen {
        html {
          background: #ececec;
        }

        body {
          max-width: 210mm;
          margin: 16mm auto;
          padding: 12mm 14mm 10mm;
          border: 2px solid var(--ink);
        }
      }

      @media screen and (max-width: 720px) {
        body {
          margin: 0;
          padding: 9mm 6mm;
          border: 0;
        }
      }

      /* ---- Header ---------------------------------------------------- */
      .head {
        border-bottom: 2px solid var(--ink);
        padding-bottom: 2mm;
        margin-bottom: 3.4mm;
      }

      .head__kicker {
        display: flex;
        align-items: center;
        gap: 2mm;
        font-size: 7.2pt;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink);
        margin: 0 0 1.2mm;
      }

      .head__kicker::before {
        content: '';
        width: 2.4mm;
        height: 2.4mm;
        background: var(--orange);
        flex: none;
      }

      .head h1 {
        font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
        font-weight: 700;
        font-size: 26pt;
        line-height: 0.92;
        letter-spacing: 0.005em;
        text-transform: uppercase;
        margin: 0 0 1.2mm;
      }

      .head__title {
        font-size: 10pt;
        font-weight: 500;
        color: var(--ink);
        margin: 0 0 1.4mm;
        max-width: 62ch;
      }

      .head__contact {
        display: flex;
        flex-wrap: wrap;
        gap: 1.2mm 3.4mm;
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 7.6pt;
        color: var(--muted);
      }

      .head__contact li {
        display: inline-flex;
        align-items: center;
        gap: 3.4mm;
      }

      .head__contact li + li::before {
        content: '·';
        color: var(--muted);
      }

      /* ---- Sections -------------------------------------------------- */
      .section {
        margin-bottom: 3.2mm;
      }

      .section:last-child {
        margin-bottom: 0;
      }

      .section > h2 {
        font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
        font-size: 13pt;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        color: var(--ink);
        margin: 0 0 1.6mm;
        padding-bottom: 0.5mm;
        border-bottom: 2px solid var(--ink);
      }

      .lead {
        font-size: 9.6pt;
        color: var(--ink);
        text-align: left;
        hyphens: auto;
        max-width: 92ch;
      }

      /* ---- Experience ------------------------------------------------ */
      .role {
        margin-bottom: 3mm;
        padding-bottom: 3mm;
        border-bottom: 1px solid var(--line);
        break-inside: avoid;
      }

      .role:last-child {
        border-bottom: 0;
        padding-bottom: 0;
        margin-bottom: 0;
      }

      .role__head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 4mm;
        break-after: avoid;
      }

      .role__org {
        font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
        font-size: 13pt;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        color: var(--ink);
        margin: 0;
        line-height: 1;
      }

      .role__role {
        font-size: 9.8pt;
        font-weight: 600;
        color: var(--ink);
        margin: 0.6mm 0 0;
      }

      .role__when {
        font-size: 8pt;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--muted);
        text-align: right;
        white-space: nowrap;
        margin: 0;
      }

      .role__when span {
        display: block;
      }

      .role__intro {
        margin: 0.9mm 0;
        font-size: 9.4pt;
        color: var(--ink);
      }

      .role ul {
        margin: 1mm 0 0;
        padding: 0;
        list-style: none;
      }

      .role ul li {
        position: relative;
        padding-left: 3.6mm;
        margin: 0 0 0.9mm;
        font-size: 9.4pt;
        break-inside: avoid;
      }

      .role ul li:last-child {
        margin-bottom: 0;
      }

      .role ul li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 1.85mm;
        width: 1.5mm;
        height: 1.5mm;
        background: var(--ink);
      }

      .role ul li strong {
        font-weight: 600;
        color: var(--ink);
      }

      /* ---- Skills ---------------------------------------------------- */
      .skills {
        display: grid;
        gap: 1.5mm;
      }

      .skill-row {
        font-size: 9.4pt;
        margin: 0;
        break-inside: avoid;
      }

      .skill-row b {
        font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        color: var(--ink);
        font-size: 10.5pt;
      }

      .skill-row span {
        color: var(--ink);
      }

      /* ---- Education ------------------------------------------------- */
      .edu {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 4mm;
      }

      .edu h3 {
        font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
        font-size: 12pt;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        margin: 0;
      }

      .edu .edu__when {
        font-size: 8pt;
        font-weight: 600;
        color: var(--muted);
        white-space: nowrap;
      }

      .edu__detail {
        font-size: 9.4pt;
        margin: 0.5mm 0 0;
      }

      .foot {
        margin-top: 4mm;
        padding-top: 2mm;
        border-top: 2px solid var(--ink);
        font-size: 7.4pt;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 4mm;
      }
    </style>
  </head>
  <body>
    <!--__HEADER__-->

    <section class="section">
      <h2>Professional Summary</h2>
      <p class="lead"><!--__SUMMARY__--></p>
    </section>

    <section class="section">
      <h2>Professional Experience</h2>
      <!--__ROLES__-->
    </section>

    <section class="section">
      <h2>Technical Skills</h2>
      <div class="skills">
        <!--__SKILLS__-->
      </div>
    </section>

    <section class="section">
      <h2>Education</h2>
      <!--__EDUCATION__-->
    </section>

    <!--__FOOTER__-->
  </body>
</html>
